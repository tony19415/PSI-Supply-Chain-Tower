name: dbt_Governance_CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    # We define environment variables for DuckDB to live in the container
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/include/psi_engine
      DBT_STATE: ${{ github.workspace }}/include/psi_engine/logs/state
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          # Ensuring all dependencies are present for the PSI Engine
          pip install -r requirements.txt  

      - name: 4. Check dbt Connection
        run: |
          cd include/psi_engine
          dbt debug
    
      - name: 4.5 Install dbt Packages
        run: |
          cd include/psi_engine
          dbt deps
    
      - name: "5. Slim CI: Build & Test (State-Aware)"
        # This only runs models you modified, saving time and compute
        run: |
          cd include/psi_engine
          dbt build --select state:modified+ --state $DBT_STATE

      - name: 6. Generate Data Catalog (dbt Docs)
        # This captures the metadata we wrote in Step 1
        run: |
          cd include/psi_engine
          dbt docs generate

      - name: 7. Upload Metadata Artifacts
        # This saves the documentation so you can view it after the run
        uses: actions/upload-artifact@v4
        with:
          name: psi-engine-metadata-catalog
          path: include/psi_engine/target/