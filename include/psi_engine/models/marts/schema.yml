version: 2

models:
  - name: fct_supply_chain_daily
    description: "The primary Gold-layer fact table for the PSI Control Tower. Grain: 1 row per product per store per day."
    config:
      meta:
        owner: "Supply Chain Analytics Team"
        criticality: "High"
        pii_status: "Anonymized"
    columns:
      - name: product_id
        description: "Product ID"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
              
      - name: inventory_health_status
        description: "Critical health of stock based on DOS Buffer"
        meta:
          business_term: "SKU Vitality"
        data_tests:
          - accepted_values:
              values: ['Healthy', 'Risk', 'Stockout']
              # If a new status like 'Unknown' appears, this test fails.
      - name: projected_inventory_on_hand
        description: "Forecasted inventory level at the end of the business day."
      - name: dw_inserted_at
        description: "Operational Metadata: Timestamp of when this record was processed by PSI Engine."